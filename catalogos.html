  .topbar{

    position:sticky;top:0;z-index:50;

  .topbar-left{display:flex;align-items:center;gap:1rem;}
  .back-btn{
    background:none;border:1px solid var(--borde);color:var(--hueso);
    padding:.4rem .9rem;border-radius:8px;cursor:pointer;font-family:'Syne',sans-serif;
    font-size:.8rem;transition:all .2s;text-decoration:none;
  }
  .back-btn:hover{border-color:var(--verde);color:var(--verde);}
  .topbar-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.06em;}
  .topbar-title span{color:var(--verde);}

 
  .layout{display:flex;min-height:calc(100vh - 57px);}

  
  .sidebar{

  }
  .sidebar-label{
    font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.15em;
    color:rgba(245,239,224,.25);text-transform:uppercase;
    padding:.5rem .75rem .25rem;
  }
  .nav-item{
    display:flex;align-items:center;gap:.75rem;
    padding:.6rem .75rem;border-radius:10px;cursor:pointer;
    font-size:.88rem;font-weight:600;color:rgba(245,239,224,.6);
    transition:all .2s;border:1px solid transparent;
  }
  .nav-item:hover{background:var(--gris);color:var(--hueso);}
  .nav-item.active{background:rgba(255,255,255,.07);color:var(--hueso);border-color:var(--borde);}
  .nav-item .nav-color{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .nav-count{
    margin-left:auto;font-family:'DM Mono',monospace;font-size:.65rem;
    background:var(--gris);padding:.15rem .5rem;border-radius:10px;
    color:rgba(245,239,224,.4);
  }

  
  .main{flex:1;padding:2rem;overflow-y:auto;}

  .section-header{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;
  }
  .section-title-block{display:block;}
  .section-eyebrow{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.12em;color:rgba(245,239,224,.3);text-transform:uppercase;margin-bottom:.3rem;}
  .section-title{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:.04em;}
  .header-actions{display:flex;gap:.6rem;align-items:center;}

  .search-input{
    background:var(--gris);border:1px solid var(--borde);
    color:var(--hueso);font-family:'Syne',sans-serif;font-size:.85rem;
    padding:.55rem 1rem;border-radius:10px;outline:none;width:220px;
    transition:border-color .2s;
  }
  .search-input::placeholder{color:rgba(245,239,224,.25);}
  .search-input:focus{border-color:var(--verde);}

  .btn-add{
    background:var(--verde);color:#fff;font-family:'Syne',sans-serif;
    font-weight:800;font-size:.85rem;border:none;padding:.6rem 1.2rem;
    border-radius:10px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.4rem;
    white-space:nowrap;
  }
  .btn-add:hover{background:#219a52;transform:translateY(-1px);}

  
  .table-wrapper{
    background:var(--card);border:1px solid var(--borde);
    border-radius:16px;overflow:hidden;
  }
  table{width:100%;border-collapse:collapse;}
  thead th{
    font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.12em;
    color:rgba(245,239,224,.3);text-transform:uppercase;
    padding:.8rem 1.1rem;text-align:left;

  }
  tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s;}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:rgba(255,255,255,.04);}
  tbody td{padding:.8rem 1.1rem;font-size:.88rem;vertical-align:middle;}

  .cell-mono{font-family:'DM Mono',monospace;font-size:.78rem;color:rgba(245,239,224,.5);}
  .cell-bold{font-weight:700;}
  .cell-price{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--naranja);}
  .cell-price-sm{font-family:'DM Mono',monospace;font-size:.8rem;color:rgba(245,239,224,.4);}

  .chip-status{
    display:inline-flex;align-items:center;gap:.3rem;
    padding:.25rem .65rem;border-radius:20px;
    font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;
  }
  .chip-on {background:rgba(39,174,96,.12);color:var(--verde);border:1px solid rgba(39,174,96,.3);}
  .chip-off{background:rgba(192,57,43,.12);color:var(--rojo);border:1px solid rgba(192,57,43,.3);}
  .chip-inactivo{background:rgba(192,57,43,.12);color:var(--rojo);border:1px solid rgba(192,57,43,.3);}
  .chip-activo{background:rgba(39,174,96,.12);color:var(--verde);border:1px solid rgba(39,174,96,.3);}

  .row-actions{display:flex;gap:.4rem;}
  .btn-edit,.btn-del{

    padding:.32rem .7rem;border-radius:7px;cursor:pointer;transition:all .2s;

  .btn-edit:hover{background:rgba(52,152,219,.1);}
  .btn-del{border:1px solid rgba(192,57,43,.3);color:var(--rojo);}
  .btn-del:hover{background:rgba(192,57,43,.1);}

  .empty-row td{text-align:center;padding:3rem;font-family:'DM Mono',monospace;font-size:.8rem;color:rgba(245,239,224,.2);}

 
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.78);
    display:flex;align-items:center;justify-content:center;
    z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;
    padding:1rem;
  }
  .modal-overlay.show{opacity:1;pointer-events:all;}
  .modal-form{
    background:var(--panel);border:1px solid var(--borde);
    border-radius:20px;width:100%;max-width:520px;
    transform:scale(.92);transition:transform .3s;overflow:hidden;
    max-height:90vh;display:flex;flex-direction:column;
  }
  .modal-overlay.show .modal-form{transform:scale(1);}

  .modal-head{
    padding:1.4rem 1.8rem;border-bottom:1px solid var(--borde);
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  }
  .modal-head-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.05em;}
  .modal-close{

  .modal-close:hover{border-color:var(--rojo);color:var(--rojo);}

  .modal-body{padding:1.5rem 1.8rem;overflow-y:auto;display:flex;flex-direction:column;gap:1rem;}

  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;}

  .form-group input,.form-group select,.form-group textarea{

    color:var(--hueso);font-family:'Syne',sans-serif;font-size:.9rem;

  .form-group textarea{resize:vertical;min-height:70px;}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--verde);}
  .form-group select option{background:#1C1C1C;}

  .modal-foot{
    padding:1.2rem 1.8rem;border-top:1px solid var(--borde);
    display:flex;justify-content:flex-end;gap:.7rem;flex-shrink:0;
  }
  .btn-cancel-modal{
    background:none;border:1px solid var(--borde);color:rgba(245,239,224,.6);

  .btn-save{
    background:var(--verde);color:#fff;font-family:'Syne',sans-serif;

    padding:.65rem 1.8rem;border-radius:10px;cursor:pointer;transition:all .2s;
  }
  .btn-save:hover{background:#219a52;}

  
  .toast{
    position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);
    background:#1C1C1C;border:1px solid var(--borde);
    color:var(--hueso);font-family:'DM Mono',monospace;font-size:.8rem;
    padding:.75rem 1.5rem;border-radius:10px;
    opacity:0;transition:all .3s;z-index:200;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.error{border-color:var(--rojo);color:var(--rojo);}
  .toast.ok{border-color:var(--verde);color:var(--verde);}
</style>
</head>

  const sec = seccionActual;

  else if (sec==='categorias')  renderCategorias();
  else if (sec==='empleados')   renderEmpleados();
  else if (sec==='clientes')    renderClientes();
  else if (sec==='promociones') renderPromociones();
  else if (sec==='sucursales')  renderSucursales();
}

function actualizarConteos() {
  document.getElementById('nc-productos').textContent   = DB.productos.length;
  document.getElementById('nc-categorias').textContent  = DB.categorias.length;
  document.getElementById('nc-empleados').textContent   = DB.empleados.length;
  document.getElementById('nc-clientes').textContent    = DB.clientes.length;
  document.getElementById('nc-promociones').textContent = DB.promociones.length;
  document.getElementById('nc-sucursales').textContent  = DB.sucursales.length;
}

function filtrar(lista, campos) {
  if (!busqueda) return lista;
  const q = busqueda.toLowerCase();
  return lista.filter(r => campos.some(f => String(r[f]||'').toLowerCase().includes(q)));
}

const COLORES = {naranja:'var(--naranja)',azul:'var(--azul)',morado:'var(--morado)',verde:'var(--verde)',amarillo:'var(--amarillo)',rojo:'var(--rojo)'};

function cabecera(titulo, color, sec) {
  return `
    <div class="section-header">
      <div class="section-title-block">
        <div class="section-eyebrow">Catálogo</div>
        <div class="section-title" style="color:${COLORES[color]}">${titulo}</div>
      </div>
      <div class="header-actions">
        <input type="text" class="search-input" placeholder="Buscar..." value="${busqueda}"
          oninput="busqueda=this.value;renderSeccion()">
        <button class="btn-add" onclick="abrirNuevo('${sec}')">+ Agregar</button>
      </div>
    </div>`;
}


function darDeBaja(tabla, id, campo, valActivo, valInactivo) {
  const reg = DB[tabla].find(r => r.id === id);
  if (!reg) return;
  if (reg[campo] === valInactivo) return toast('Ya está dado de baja', 'error');
  if (!confirm(`¿Dar de baja este registro? Se marcará como "${valInactivo}" (baja lógica).`)) return;
  reg[campo] = valInactivo;
  renderSeccion();
  toast('Baja lógica aplicada correctamente', 'ok');
}


function abrirNuevo(sec) {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Agregar ' + {
    productos:'Producto', categorias:'Categoría', empleados:'Empleado',
    clientes:'Cliente', promociones:'Promoción', sucursales:'Sucursal'
  }[sec];
  document.getElementById('modal-body').innerHTML = formHTML(sec, null);
  document.getElementById('modal').classList.add('show');
}

function abrirEditar(sec, id) {
  editingId = id;
  const reg = DB[sec].find(r => r.id === id);
  document.getElementById('modal-title').textContent = 'Editar ' + {
    productos:'Producto', categorias:'Categoría', empleados:'Empleado',
    clientes:'Cliente', promociones:'Promoción', sucursales:'Sucursal'
  }[sec];
  document.getElementById('modal-body').innerHTML = formHTML(sec, reg);
  document.getElementById('modal').classList.add('show');
}

function cerrarModal() {
  document.getElementById('modal').classList.remove('show');
  editingId = null;
}

document.getElementById('modal').addEventListener('click', e => { if(e.target.id==='modal') cerrarModal(); });

function formHTML(sec, data) {
  const v = (f, def='') => data ? (data[f] ?? def) : def;
  const optCats = DB.categorias.map(c => `<option value="${c.id}" ${v('cat_id')==c.id?'selected':''}>${c.nombre}</option>`).join('');
  const optSucs = DB.sucursales.map(s => `<option value="${s.id}" ${v('suc_id')==s.id?'selected':''}>${s.nombre}</option>`).join('');

  if (sec==='productos') return `
    <div class="form-row">
      <div class="form-group full"><label>Nombre</label><input id="f-nombre" value="${v('nombre')}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Categoría</label><select id="f-cat_id">${optCats}</select></div>
      <div class="form-group"><label>Estatus</label><select id="f-estatus">
        <option value="disponible" ${v('estatus')==='disponible'?'selected':''}>Disponible</option>
        <option value="no disponible" ${v('estatus')==='no disponible'?'selected':''}>No disponible</option>
      </select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Precio ($)</label><input id="f-precio" type="number" step="0.01" value="${v('precio',0)}"></div>
      <div class="form-group"><label>Costo ($)</label><input id="f-costo" type="number" step="0.01" value="${v('costo',0)}"></div>
    </div>
    <div class="form-row">
      <div class="form-group full"><label>Descripción</label><textarea id="f-desc">${v('desc')}</textarea></div>
    </div>`;

  if (sec==='categorias') return `
    <div class="form-group"><label>Nombre</label><input id="f-nombre" value="${v('nombre')}"></div>
    <div class="form-group"><label>Descripción</label><textarea id="f-descripcion">${v('descripcion')}</textarea></div>`;

  if (sec==='empleados') return `
    <div class="form-row">
      <div class="form-group full"><label>Nombre Completo</label><input id="f-nombre" value="${v('nombre')}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Teléfono</label><input id="f-tel" value="${v('tel')}"></div>
      <div class="form-group"><label>Puesto</label><select id="f-puesto">
        ${['cajero','cocinero','repartidor','gerente'].map(p=>`<option ${v('puesto')===p?'selected':''}>${p}</option>`).join('')}
      </select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Sucursal</label><select id="f-suc_id">${optSucs}</select></div>
      <div class="form-group"><label>Salario Quincenal</label><input id="f-salario" type="number" value="${v('salario',0)}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Fecha Ingreso</label><input id="f-ingreso" type="date" value="${v('ingreso')}"></div>
      <div class="form-group"><label>Estatus</label><select id="f-estatus">
        <option value="activo" ${v('estatus')==='activo'?'selected':''}>Activo</option>
        <option value="inactivo" ${v('estatus')==='inactivo'?'selected':''}>Inactivo</option>
      </select></div>
    </div>`;

  if (sec==='clientes') return `
    <div class="form-group"><label>Nombre Completo</label><input id="f-nombre" value="${v('nombre')}"></div>
    <div class="form-row">
      <div class="form-group"><label>Teléfono</label><input id="f-tel" value="${v('tel')}"></div>
      <div class="form-group"><label>Ciudad</label><input id="f-ciudad" value="${v('ciudad')}"></div>
    </div>
    <div class="form-group"><label>Correo Electrónico</label><input id="f-correo" type="email" value="${v('correo')}"></div>`;

  if (sec==='promociones') return `
    <div class="form-group"><label>Nombre</label><input id="f-nombre" value="${v('nombre')}"></div>
    <div class="form-group"><label>Descripción</label><textarea id="f-desc">${v('desc')}</textarea></div>
    <div class="form-row">
      <div class="form-group"><label>Descuento (%)</label><input id="f-pct" type="number" min="1" max="100" value="${v('pct',10)}"></div>
      <div class="form-group"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Fecha Inicio</label><input id="f-inicio" type="date" value="${v('inicio')}"></div>
      <div class="form-group"><label>Fecha Fin</label><input id="f-fin" type="date" value="${v('fin')}"></div>
    </div>`;

  if (sec==='sucursales') return `
    <div class="form-group"><label>Nombre</label><input id="f-nombre" value="${v('nombre')}"></div>
    <div class="form-row">
      <div class="form-group"><label>Ciudad</label><input id="f-ciudad" value="${v('ciudad')}"></div>
      <div class="form-group"><label>Teléfono</label><input id="f-tel" value="${v('tel')}"></div>
    </div>
    <div class="form-group"><label>Dirección</label><input id="f-dir" value="${v('dir')}"></div>
    <div class="form-group"><label>Estatus</label><select id="f-estatus">
      <option value="activa" ${v('estatus')==='activa'?'selected':''}>Activa</option>
      <option value="cerrada" ${v('estatus')==='cerrada'?'selected':''}>Cerrada</option>
    </select></div>`;

  return '';
}


function g(id) { const el=document.getElementById(id); return el?el.value.trim():''; }

function guardar() {
  const sec = seccionActual;
  let data = {};

  if (sec==='productos') {
    if (!g('f-nombre')) return toast('El nombre es obligatorio', 'error');
    data = {nombre:g('f-nombre'), cat_id:parseInt(g('f-cat_id')), precio:parseFloat(g('f-precio'))||0,
            costo:parseFloat(g('f-costo'))||0, desc:g('f-desc'), estatus:g('f-estatus')};
  } else if (sec==='categorias') {
    if (!g('f-nombre')) return toast('El nombre es obligatorio', 'error');
    data = {nombre:g('f-nombre'), descripcion:g('f-descripcion')};
  } else if (sec==='empleados') {
    if (!g('f-nombre')) return toast('El nombre es obligatorio', 'error');
    data = {nombre:g('f-nombre'), tel:g('f-tel'), puesto:g('f-puesto'),
            suc_id:parseInt(g('f-suc_id')), salario:parseFloat(g('f-salario'))||0,
            ingreso:g('f-ingreso'), estatus:g('f-estatus')};
  } else if (sec==='clientes') {
    if (!g('f-nombre')) return toast('El nombre es obligatorio', 'error');
    data = {nombre:g('f-nombre'), tel:g('f-tel'), correo:g('f-correo'), ciudad:g('f-ciudad')};
  } else if (sec==='promociones') {
    if (!g('f-nombre')) return toast('El nombre es obligatorio', 'error');
    data = {nombre:g('f-nombre'), desc:g('f-desc'), pct:parseFloat(g('f-pct'))||10,
            inicio:g('f-inicio'), fin:g('f-fin')};
  } else if (sec==='sucursales') {
    if (!g('f-nombre')) return toast('El nombre es obligatorio', 'error');
    data = {nombre:g('f-nombre'), ciudad:g('f-ciudad'), tel:g('f-tel'), dir:g('f-dir'), estatus:g('f-estatus')};
  }

  if (editingId !== null) {
    const idx = DB[sec].findIndex(r => r.id === editingId);
    if (idx >= 0) DB[sec][idx] = {...DB[sec][idx], ...data};
    toast('Registro actualizado ✓', 'ok');
  } else {
    data.id = ++nextId;
    if (sec==='clientes') data.reg = new Date().toISOString().slice(0,10);
    DB[sec].push(data);
    toast('Registro creado ✓', 'ok');
  }

  cerrarModal();
  renderSeccion();
}

function toast(msg, tipo='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (tipo ? ' '+tipo : '');
  setTimeout(() => el.className = 'toast', 2800);
}

renderSeccion();
</script>
