<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TacoSoft — Gestión de Pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --rojo:#C0392B; --naranja:#E67E22; --amarillo:#F1C40F;
    --verde:#27AE60; --azul:#3498DB; --morado:#8E44AD;
    --oscuro:#111; --panel:#181818; --hueso:#F5EFE0;
    --borde:rgba(255,255,255,.09); --gris:rgba(255,255,255,.05);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--oscuro);font-family:'Syne',sans-serif;color:var(--hueso);min-height:100vh;}

  
  .topbar{
    background:var(--panel);border-bottom:1px solid var(--borde);
    padding:.9rem 2rem;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:50;
  }
  .topbar-left{display:flex;align-items:center;gap:1rem;}
  .back-btn{
    background:none;border:1px solid var(--borde);color:var(--hueso);
    padding:.4rem .9rem;border-radius:8px;cursor:pointer;font-family:'Syne',sans-serif;
    font-size:.8rem;transition:all .2s;text-decoration:none;
  }
  .back-btn:hover{border-color:var(--azul);color:var(--azul);}
  .topbar-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.06em;}
  .topbar-title span{color:var(--azul);}
  .topbar-right{display:flex;align-items:center;gap:.75rem;}

  
  .filtros{
    padding:1.2rem 2rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;
    border-bottom:1px solid var(--borde);background:var(--panel);
  }
  .filtro-label{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.12em;color:rgba(245,239,224,.3);text-transform:uppercase;margin-right:.3rem;}
  .filtro-btn{
    background:var(--gris);border:1px solid var(--borde);color:rgba(245,239,224,.6);
    font-family:'Syne',sans-serif;font-size:.8rem;font-weight:600;
    padding:.45rem 1rem;border-radius:20px;cursor:pointer;transition:all .2s;
  }
  .filtro-btn.active{background:var(--color-estatus,var(--azul));color:#fff;border-color:transparent;}
  .filtro-btn:hover{border-color:var(--color-estatus,var(--azul));color:var(--hueso);}

  .sel-sucursal{
    background:var(--gris);border:1px solid var(--borde);color:var(--hueso);
    font-family:'Syne',sans-serif;font-size:.82rem;padding:.45rem .9rem;
    border-radius:20px;outline:none;margin-left:auto;
  }
  .sel-sucursal option{background:#1C1C1C;}

  
  .badge{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:20px;height:20px;padding:0 .35rem;
    background:rgba(255,255,255,.1);border-radius:10px;
    font-family:'DM Mono',monospace;font-size:.65rem;margin-left:.4rem;
  }

  
  .pedidos-container{padding:1.5rem 2rem;max-width:1400px;margin:0 auto;}

  .section-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:1rem;
  }
  .section-title{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.05em;}
  .count-info{font-family:'DM Mono',monospace;font-size:.75rem;color:rgba(245,239,224,.4);}

  .pedidos-table{width:100%;border-collapse:separate;border-spacing:0 .5rem;}
  .pedidos-table thead tr th{
    font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.12em;
    color:rgba(245,239,224,.3);text-transform:uppercase;
    padding:.6rem 1rem;text-align:left;
  }

  .pedido-row{
    background:var(--gris);border:1px solid var(--borde);
    cursor:pointer;transition:all .2s;animation:rowIn .3s ease both;
  }
  @keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  .pedido-row:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15);}
  .pedido-row td{padding:.85rem 1rem;vertical-align:middle;}
  .pedido-row td:first-child{border-radius:12px 0 0 12px;}
  .pedido-row td:last-child{border-radius:0 12px 12px 0;}

  .folio{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.05em;color:var(--naranja);}
  .fecha-hora{font-family:'DM Mono',monospace;font-size:.72rem;color:rgba(245,239,224,.5);}
  .sucursal-cell{font-size:.85rem;font-weight:700;}
  .empleado-cell{font-size:.82rem;color:rgba(245,239,224,.7);}
  .cliente-cell{font-size:.82rem;color:rgba(245,239,224,.6);}
  .tipo-cell{font-size:.8rem;}
  .total-cell{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--hueso);}

  
  .chip{
    display:inline-flex;align-items:center;gap:.35rem;
    padding:.3rem .75rem;border-radius:20px;
    font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.06em;
    font-weight:500;text-transform:uppercase;
  }
  .chip-pendiente  {background:rgba(241,196,15,.12);color:var(--amarillo);border:1px solid rgba(241,196,15,.3);}
  .chip-preparando {background:rgba(230,126,34,.12);color:var(--naranja);border:1px solid rgba(230,126,34,.3);}
  .chip-listo      {background:rgba(52,152,219,.12);color:var(--azul);border:1px solid rgba(52,152,219,.3);}
  .chip-entregado  {background:rgba(39,174,96,.12);color:var(--verde);border:1px solid rgba(39,174,96,.3);}
  .chip-cancelado  {background:rgba(192,57,43,.12);color:var(--rojo);border:1px solid rgba(192,57,43,.3);}

  
  .actions-cell{display:flex;gap:.4rem;align-items:center;}
  .btn-action{
    background:none;border:1px solid var(--borde);color:rgba(245,239,224,.6);
    font-family:'Syne',sans-serif;font-size:.75rem;font-weight:600;
    padding:.35rem .75rem;border-radius:7px;cursor:pointer;transition:all .2s;
    white-space:nowrap;
  }
  .btn-avanzar{border-color:rgba(39,174,96,.3);color:var(--verde);}
  .btn-avanzar:hover{background:rgba(39,174,96,.15);}
  .btn-cancelar{border-color:rgba(192,57,43,.3);color:var(--rojo);}
  .btn-cancelar:hover{background:rgba(192,57,43,.15);}
  .btn-ver{border-color:rgba(52,152,219,.3);color:var(--azul);}
  .btn-ver:hover{background:rgba(52,152,219,.1);}

  .empty-state{
    text-align:center;padding:4rem;color:rgba(245,239,224,.2);
    font-family:'DM Mono',monospace;
  }
  .empty-icon{font-size:3rem;margin-bottom:1rem;}

  
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.75);
    display:flex;align-items:center;justify-content:center;
    z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .modal-overlay.show{opacity:1;pointer-events:all;}
  .modal-detalle{
    background:var(--panel);border:1px solid var(--borde);
    border-radius:20px;padding:0;max-width:560px;width:95%;
    transform:scale(.92);transition:transform .3s;overflow:hidden;
  }
  .modal-overlay.show .modal-detalle{transform:scale(1);}

  .modal-header{
    padding:1.5rem 2rem;border-bottom:1px solid var(--borde);
    display:flex;align-items:center;justify-content:space-between;
  }
  .modal-title{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:.05em;}
  .modal-close{
    background:none;border:1px solid var(--borde);color:var(--hueso);
    width:32px;height:32px;border-radius:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;
    transition:all .2s;
  }
  .modal-close:hover{border-color:var(--rojo);color:var(--rojo);}

  .modal-meta{
    padding:1.2rem 2rem;display:grid;grid-template-columns:1fr 1fr;
    gap:.75rem;border-bottom:1px solid var(--borde);
  }
  .meta-label{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;color:rgba(245,239,224,.3);text-transform:uppercase;margin-bottom:.25rem;}
  .meta-value{font-size:.9rem;font-weight:600;}

  .modal-items{padding:1.2rem 2rem;border-bottom:1px solid var(--borde);}
  .item-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:.6rem 0;border-bottom:1px solid rgba(255,255,255,.04);
  }
  .item-row:last-child{border-bottom:none;}
  .item-nombre{font-size:.88rem;}
  .item-qty{font-family:'DM Mono',monospace;font-size:.75rem;color:rgba(245,239,224,.4);margin:0 1rem;}
  .item-sub{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--naranja);}

  .modal-total{
    padding:1.2rem 2rem;display:flex;justify-content:space-between;align-items:center;
  }
  .total-grande{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;color:var(--verde);letter-spacing:.03em;}

  /* TOAST */
  .toast{
    position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);
    background:#1C1C1C;border:1px solid var(--borde);
    color:var(--hueso);font-family:'DM Mono',monospace;font-size:.8rem;
    padding:.75rem 1.5rem;border-radius:10px;
    opacity:0;transition:all .3s;z-index:200;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.error{border-color:var(--rojo);color:var(--rojo);}
  .toast.ok{border-color:var(--verde);color:var(--verde);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="index.html" onclick="if(window.parent !== window){ event.preventDefault(); window.parent.cerrarModulo(); }" class="back-btn">← Inicio</a>
    <div class="topbar-title">Gestión de <span>Pedidos</span></div>
  </div>
  <div class="topbar-right">
    <select class="sel-sucursal" id="sel-sucursal" onchange="filtrar()">
      <option value="">Todas las sucursales</option>
      <option value="1">Culiacán</option>
      <option value="2">Mazatlán</option>
      <option value="3">Los Mochis</option>
      <option value="4">Guasave</option>
    </select>
  </div>
</div>

<!-- FILTROS POR ESTATUS -->
<div class="filtros">
  <span class="filtro-label">Estatus:</span>
  <button class="filtro-btn active" data-est="" style="--color-estatus:#aaa" onclick="setFiltro('',this)">
    Todos <span class="badge" id="cnt-todos">0</span>
  </button>
  <button class="filtro-btn" data-est="pendiente" style="--color-estatus:#F1C40F" onclick="setFiltro('pendiente',this)">
    ⏳ Pendiente <span class="badge" id="cnt-pendiente">0</span>
  </button>
  <button class="filtro-btn" data-est="preparando" style="--color-estatus:#E67E22" onclick="setFiltro('preparando',this)">
    👨‍🍳 Preparando <span class="badge" id="cnt-preparando">0</span>
  </button>
  <button class="filtro-btn" data-est="listo" style="--color-estatus:#3498DB" onclick="setFiltro('listo',this)">
    ✅ Listo <span class="badge" id="cnt-listo">0</span>
  </button>
  <button class="filtro-btn" data-est="entregado" style="--color-estatus:#27AE60" onclick="setFiltro('entregado',this)">
    🛵 Entregado <span class="badge" id="cnt-entregado">0</span>
  </button>
  <button class="filtro-btn" data-est="cancelado" style="--color-estatus:#C0392B" onclick="setFiltro('cancelado',this)">
    ❌ Cancelado <span class="badge" id="cnt-cancelado">0</span>
  </button>
</div>

<div class="pedidos-container">
  <div class="section-header">
    <div class="section-title" id="section-title">Todos los Pedidos</div>
    <div class="count-info" id="count-info">—</div>
  </div>

  <table class="pedidos-table">
    <thead>
      <tr>
        <th>Folio</th>
        <th>Fecha / Hora</th>
        <th>Sucursal</th>
        <th>Cajero</th>
        <th>Cliente</th>
        <th>Tipo</th>
        <th>Estatus</th>
        <th>Total</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="pedidos-tbody"></tbody>
  </table>

  <div id="empty-state" class="empty-state" style="display:none;">
    <div class="empty-icon">📋</div>
    <div>No hay pedidos con este filtro</div>
  </div>
</div>

<!-- MODAL DETALLE -->
<div class="modal-overlay" id="modal">
  <div class="modal-detalle">
    <div class="modal-header">
      <div class="modal-title" id="m-title">Pedido #000</div>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-meta">
      <div class="meta-item"><div class="meta-label">Sucursal</div><div class="meta-value" id="m-sucursal">—</div></div>
      <div class="meta-item"><div class="meta-label">Estatus</div><div class="meta-value" id="m-estatus">—</div></div>
      <div class="meta-item"><div class="meta-label">Cajero</div><div class="meta-value" id="m-cajero">—</div></div>
      <div class="meta-item"><div class="meta-label">Cliente</div><div class="meta-value" id="m-cliente">—</div></div>
      <div class="meta-item"><div class="meta-label">Tipo</div><div class="meta-value" id="m-tipo">—</div></div>
      <div class="meta-item"><div class="meta-label">Fecha</div><div class="meta-value" id="m-fecha">—</div></div>
    </div>
    <div class="modal-items" id="m-items"></div>
    <div class="modal-total">
      <span style="font-family:'DM Mono',monospace;font-size:.8rem;color:rgba(245,239,224,.4)">TOTAL</span>
      <span class="total-grande" id="m-total">$0.00</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATOS DEMO ──
let pedidos = [
  {id:1,  fecha:'2026-04-01 12:30', suc_id:1, suc:'Culiacán',  emp:'Karla Rojo',    cli:'Juan Burgos',      tipo:'en local',    est:'entregado', total:160,
   items:[{n:'Taco de Birria',q:2,p:45},{n:'Agua de Horchata',q:2,p:22},{n:'Guacamole',q:1,p:30}]},
  {id:2,  fecha:'2026-04-01 13:15', suc_id:1, suc:'Culiacán',  emp:'Karla Rojo',    cli:'Público General',  tipo:'para llevar', est:'entregado', total:198,
   items:[{n:'Burrito de Carne',q:2,p:75},{n:'Refresco',q:2,p:25},{n:'Salsa Roja',q:2,p:10},{n:'Churros',q:1,p:40}]},
  {id:3,  fecha:'2026-04-02 14:00', suc_id:2, suc:'Mazatlán',  emp:'Jesús Cota',    cli:'Roberto Celis',    tipo:'en local',    est:'entregado', total:175,
   items:[{n:'Taco de Camarón',q:2,p:55},{n:'Agua de Jamaica',q:2,p:20},{n:'Orden de Queso',q:1,p:20},{n:'Flan de Cajeta',q:1,p:35}]},
  {id:4,  fecha:'2026-04-02 19:00', suc_id:2, suc:'Mazatlán',  emp:'Jesús Cota',    cli:'Diana Páez',       tipo:'a domicilio', est:'entregado', total:240,
   items:[{n:'Burrito de Camarón',q:2,p:85},{n:'Refresco',q:2,p:25},{n:'Cajeta con Nieve',q:1,p:45}]},
  {id:5,  fecha:'2026-04-03 12:00', suc_id:3, suc:'Los Mochis',emp:'Fabiola Chávez', cli:'Carlos Meza',     tipo:'en local',    est:'entregado', total:135,
   items:[{n:'Taco de Carne Asada',q:2,p:40},{n:'Taco de Carnitas',q:1,p:38},{n:'Guacamole',q:1,p:30}]},
  {id:6,  fecha:'2026-04-03 13:45', suc_id:4, suc:'Guasave',   emp:'Héctor Corrales',cli:'Público General', tipo:'para llevar', est:'entregado', total:100,
   items:[{n:'Taco de Frijoles',q:2,p:28},{n:'Café de Olla',q:1,p:30},{n:'Salsa Roja',q:2,p:10}]},
  {id:23, fecha:'2026-05-12 20:00', suc_id:4, suc:'Guasave',   emp:'Héctor Corrales',cli:'Gustavo Robles',  tipo:'en local',    est:'listo',     total:170,
   items:[{n:'Burrito Vegetariano',q:1,p:65},{n:'Agua de Horchata',q:2,p:22},{n:'Flan de Cajeta',q:1,p:35}]},
  {id:24, fecha:'2026-05-14 13:00', suc_id:1, suc:'Culiacán',  emp:'Karla Rojo',    cli:'Sandra Félix',     tipo:'a domicilio', est:'preparando', total:240,
   items:[{n:'Burrito de Camarón',q:2,p:85},{n:'Refresco',q:1,p:25},{n:'Cajeta con Nieve',q:1,p:45}]},
  {id:25, fecha:'2026-05-16 09:00', suc_id:2, suc:'Mazatlán',  emp:'Jesús Cota',    cli:'Público General',  tipo:'en local',    est:'pendiente', total:110,
   items:[{n:'Taco de Carne Asada',q:2,p:40},{n:'Salsa Roja',q:1,p:10},{n:'Café de Olla',q:1,p:30}]},
  {id:26, fecha:'2026-05-13 14:00', suc_id:3, suc:'Los Mochis',emp:'Fabiola Chávez', cli:'Miriam Acosta',   tipo:'para llevar', est:'cancelado', total:0,
   items:[{n:'Burrito de Carne',q:1,p:75},{n:'Agua de Jamaica',q:1,p:20}]},
  {id:30, fecha:'2026-05-16 10:30', suc_id:3, suc:'Los Mochis',emp:'Fabiola Chávez', cli:'Público General', tipo:'en local',    est:'pendiente', total:125,
   items:[{n:'Taco de Frijoles',q:3,p:28},{n:'Refresco',q:1,p:25},{n:'Café de Olla',q:1,p:30}]},
];

// Arreglo de items — garantizar que siempre tengan q numérica
pedidos = pedidos.map(p => ({...p, items: p.items.map(i => ({n:i.n, q: typeof i.q === 'number' ? i.q : 1, p:i.p}))}));

let filtroEst = '';
let filtroSuc = '';

// ── FLUJO ──
const FLUJO = {pendiente:'preparando', preparando:'listo', listo:'entregado'};
const FLUJO_LABEL = {preparando:'→ Preparando', listo:'→ Listo', entregado:'→ Entregado'};
const ICONOS_TIPO = {'en local':'🪑','para llevar':'🥡','a domicilio':'🛵'};

function chipEstatus(est) {
  const icons = {pendiente:'⏳',preparando:'👨‍🍳',listo:'✅',entregado:'🛵',cancelado:'❌'};
  return `<span class="chip chip-${est}">${icons[est]||''} ${est}</span>`;
}

function setFiltro(est, btn) {
  filtroEst = est;
  document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const labels = {'':`Todos los Pedidos`, pendiente:'Pendientes', preparando:'En Preparación', listo:'Listos', entregado:'Entregados', cancelado:'Cancelados'};
  document.getElementById('section-title').textContent = labels[est] || 'Pedidos';
  renderTabla();
}

function filtrar() {
  filtroSuc = document.getElementById('sel-sucursal').value;
  renderTabla();
}

function contarPorEstatus() {
  const ests = ['pendiente','preparando','listo','entregado','cancelado'];
  let total = 0;
  ests.forEach(e => {
    const c = pedidos.filter(p => p.est === e && (!filtroSuc || p.suc_id == filtroSuc)).length;
    const el = document.getElementById('cnt-'+e);
    if(el) el.textContent = c;
    total += c;
  });
  document.getElementById('cnt-todos').textContent = total;
}

function renderTabla() {
  contarPorEstatus();
  let lista = pedidos;
  if (filtroEst) lista = lista.filter(p => p.est === filtroEst);
  if (filtroSuc) lista = lista.filter(p => p.suc_id == filtroSuc);

  const tbody = document.getElementById('pedidos-tbody');
  const empty = document.getElementById('empty-state');
  document.getElementById('count-info').textContent = `${lista.length} pedido(s)`;

  if (lista.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = '';
  lista.sort((a,b) => b.id - a.id).forEach((p, idx) => {
    const siguienteEst = FLUJO[p.est];
    const puedeAvanzar = !!siguienteEst;
    const puedeCancelar = ['pendiente','preparando'].includes(p.est);

    const tr = document.createElement('tr');
    tr.className = 'pedido-row';
    tr.style.animationDelay = `${idx * .04}s`;
    tr.innerHTML = `
      <td><div class="folio">#${String(p.id).padStart(4,'0')}</div></td>
      <td><div class="fecha-hora">${p.fecha}</div></td>
      <td><div class="sucursal-cell">${p.suc}</div></td>
      <td><div class="empleado-cell">${p.emp}</div></td>
      <td><div class="cliente-cell">${p.cli}</div></td>
      <td><div class="tipo-cell">${ICONOS_TIPO[p.tipo]||''} ${p.tipo}</div></td>
      <td>${chipEstatus(p.est)}</td>
      <td><div class="total-cell">$${p.total.toFixed(2)}</div></td>
      <td>
        <div class="actions-cell">
          <button class="btn-action btn-ver" onclick="verDetalle(${p.id}, event)">👁 Ver</button>
          ${puedeAvanzar ? `<button class="btn-action btn-avanzar" onclick="avanzarEstatus(${p.id}, event)">${FLUJO_LABEL[siguienteEst]}</button>` : ''}
          ${puedeCancelar ? `<button class="btn-action btn-cancelar" onclick="cancelarPedido(${p.id}, event)">✕ Cancelar</button>` : ''}
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function avanzarEstatus(id, e) {
  e.stopPropagation();
  const p = pedidos.find(x => x.id === id);
  if (!p) return;
  const siguiente = FLUJO[p.est];
  if (!siguiente) return toast('No se puede avanzar este pedido', 'error');
  p.est = siguiente;
  renderTabla();
  toast(`Pedido #${id} → ${siguiente}`, 'ok');
}

function cancelarPedido(id, e) {
  e.stopPropagation();
  if (!confirm(`¿Cancelar el pedido #${id}? Esta acción no se puede revertir.`)) return;
  const p = pedidos.find(x => x.id === id);
  if (!p) return;
  if (!['pendiente','preparando'].includes(p.est)) return toast('Este pedido no se puede cancelar', 'error');
  p.est = 'cancelado';
  p.total = 0;
  renderTabla();
  toast(`Pedido #${id} cancelado`, 'error');
}

function verDetalle(id, e) {
  e?.stopPropagation();
  const p = pedidos.find(x => x.id === id);
  if (!p) return;

  document.getElementById('m-title').textContent   = `Pedido #${String(p.id).padStart(4,'0')}`;
  document.getElementById('m-sucursal').textContent = p.suc;
  document.getElementById('m-estatus').innerHTML    = chipEstatus(p.est);
  document.getElementById('m-cajero').textContent   = p.emp;
  document.getElementById('m-cliente').textContent  = p.cli;
  document.getElementById('m-tipo').textContent     = `${ICONOS_TIPO[p.tipo]||''} ${p.tipo}`;
  document.getElementById('m-fecha').textContent    = p.fecha;

  const cont = document.getElementById('m-items');
  cont.innerHTML = '';
  let total = 0;
  (p.items||[]).forEach(item => {
    const sub = item.q * item.p;
    total += sub;
    const div = document.createElement('div');
    div.className = 'item-row';
    div.innerHTML = `
      <span class="item-nombre">${item.n}</span>
      <span class="item-qty">x${item.q}  @$${item.p}</span>
      <span class="item-sub">$${sub.toFixed(2)}</span>
    `;
    cont.appendChild(div);
  });

  document.getElementById('m-total').textContent = `$${p.total.toFixed(2)}`;
  document.getElementById('modal').classList.add('show');
}

function cerrarModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) cerrarModal();
});

// TOAST
function toast(msg, tipo='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (tipo ? ' '+tipo : '');
  setTimeout(() => el.className = 'toast', 2800);
}

// INIT
renderTabla();
</script>
</body>
</html>
